<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دانلودر</title>
<style>
body { font-family: Tahoma, sans-serif; background:#111; color:#eee; display:flex; justify-content:center; padding:40px 12px; }
.box { background:#1b1b1b; padding:24px; border-radius:12px; width:100%; max-width:440px; }
input, select, button { width:100%; padding:12px; margin-top:10px; border-radius:8px; border:none; font-size:15px; box-sizing:border-box; }
input, select { background:#2a2a2a; color:#fff; }
button { background:#4c8bf5; color:#fff; cursor:pointer; }
button:disabled { background:#555; }
button.secondary { background:#333; }
#status { margin-top:14px; font-size:14px; color:#aaa; white-space:pre-wrap; }
a.file-link { display:block; margin-top:14px; color:#4c8bf5; text-align:center; word-break:break-all; }
.mode-row { display:flex; gap:8px; margin-top:10px; }
.mode-row button { margin-top:0; }
.mode-row button.active { background:#4c8bf5; }
.thumb { width:100%; border-radius:8px; margin-top:12px; }
.title { margin-top:8px; font-size:14px; color:#ccc; }
</style>
</head>
<body>
<div class="box">
<h2>دانلودر ویدیو / صدا</h2>
<input id="url" placeholder="لینک را وارد کن">
<button id="fetchBtn" onclick="fetchFormats()">دریافت کیفیت‌ها</button>

<div id="preview" style="display:none">
<img id="thumb" class="thumb">
<div id="title" class="title"></div>
<select id="format"></select>

<div class="mode-row">
<button id="modeDirect" class="active" onclick="setMode('direct')">دانلود مستقیم</button>
<button id="modeLink" onclick="setMode('link')">فقط لینک (برای IDM/ADM)</button>
</div>

<button id="btn" onclick="startDownload()">شروع</button>
</div>

<div id="status"></div>
</div>
<script>
let currentMode = 'direct';
let currentFormats = [];

function setMode(m) {
  currentMode = m;
  document.getElementById('modeDirect').classList.toggle('active', m === 'direct');
  document.getElementById('modeLink').classList.toggle('active', m === 'link');
}

async function fetchFormats() {
  const url = document.getElementById('url').value.trim();
  const statusEl = document.getElementById('status');
  if (!url) return;
  statusEl.textContent = 'در حال دریافت اطلاعات...';
  document.getElementById('preview').style.display = 'none';

  const res = await fetch('/api/formats', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({url})
  });
  const data = await res.json();
  if (data.error) {
    statusEl.textContent = 'خطا: ' + data.error;
    return;
  }
  statusEl.textContent = '';
  document.getElementById('thumb').src = data.thumbnail || '';
  document.getElementById('title').textContent = data.title || '';
  const select = document.getElementById('format');
  select.innerHTML = '';

  const audioOpt = document.createElement('option');
  audioOpt.value = 'audio';
  audioOpt.textContent = 'فقط صدا (mp3)';
  select.appendChild(audioOpt);

  (data.formats || []).forEach(f => {
    const opt = document.createElement('option');
    opt.value = f.format_id;
    const size = f.filesize ? (f.filesize / 1048576).toFixed(1) + ' MB' : '';
    opt.textContent = `${f.label} (${f.ext}) ${size}`;
    select.appendChild(opt);
  });

  document.getElementById('preview').style.display = 'block';
}

async function startDownload() {
  const url = document.getElementById('url').value.trim();
  const format_id = document.getElementById('format').value;
  const btn = document.getElementById('btn');
  const statusEl = document.getElementById('status');
  if (!url) return;
  btn.disabled = true;
  statusEl.textContent = 'در صف قرار گرفت...';

  const res = await fetch('/api/download', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({url, format_id, mode: currentMode})
  });
  const data = await res.json();
  if (data.error) {
    statusEl.textContent = 'خطا: ' + data.error;
    btn.disabled = false;
    return;
  }
  poll(data.job_id);
}

async function poll(jobId) {
  const statusEl = document.getElementById('status');
  const btn = document.getElementById('btn');
  let ticks = 0;
  const interval = setInterval(async () => {
    ticks++;
    let res, data;
    try {
      res = await fetch('/api/status/' + jobId);
      data = await res.json();
    } catch (e) {
      return;
    }
    if (res.status === 404) {
      clearInterval(interval);
      statusEl.textContent = 'خطا: کار پیدا نشد (شاید سرور ری‌استارت شده)';
      btn.disabled = false;
      return;
    }
    if (data.status === 'queued') {
      statusEl.textContent = 'در صف...';
    } else if (data.status === 'processing') {
      statusEl.textContent = 'در حال دانلود... (' + (ticks * 2) + ' ثانیه)';
      if (ticks * 2 > 90) {
        statusEl.textContent += ' — اگه خیلی طول کشید، لاگ Railway رو چک کن';
      }
    } else if (data.status === 'done') {
      clearInterval(interval);
      statusEl.textContent = 'آماده شد: ' + data.title;
      if (data.mode === 'link') {
        const link = document.createElement('a');
        link.className = 'file-link';
        link.href = data.link;
        link.textContent = data.link;
        link.target = '_blank';
        statusEl.appendChild(document.createElement('br'));
        statusEl.appendChild(link);
        const hint = document.createElement('div');
        hint.textContent = 'این لینک را در ADM یا IDM بچسبان';
        hint.style.marginTop = '6px';
        statusEl.appendChild(hint);
      } else {
        window.location.href = data.link;
        const link = document.createElement('a');
        link.className = 'file-link';
        link.href = data.link;
        link.textContent = 'اگر دانلود شروع نشد، اینجا بزن';
        statusEl.appendChild(document.createElement('br'));
        statusEl.appendChild(link);
      }
      btn.disabled = false;
    } else if (data.status === 'error') {
      clearInterval(interval);
      statusEl.textContent = 'خطا: ' + data.error;
      btn.disabled = false;
    }
  }, 2000);
}
</script>
</body>
</html>
